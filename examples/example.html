<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!--<meta http-equiv="X-UA-Compatible" content="IE=edge">-->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=1" />
    <link rel="stylesheet" href="css/nft-style.css" />
    <title>A simple example with webarkit-cv</title>
</head>

<body>

    <div id="app">
        <video id="video"  muted playsinline autoplay></video>
    </div>

    <img src="pinball.jpg" id="pinball" style="display: none;">

    <script src="../dist/webarkitCV.js"></script>
    <script>
        console.log(WebARKitCV);

        const video = document.getElementById('video');

    const cameraView = new WebARKitCV.CameraViewRenderer(video);
    cameraView.setPreserveImageSize(true);
    cameraView.setTargetFrameRate(30);
    // Optionally adjust the processing canvas scale if needed
    cameraView.setTargetLongSideLength(640);
    cameraView.setPreserveImageSize(true);

        const videoSettingData = {
            width: {min: 1280, max: 1920},
            height: {min: 720, max: 1080},
            facingMode: "environment",
            targetFrameRate: 60
        };

        const oWidth = 1280;
        const oHeight = 720;

        const webarkit = new WebARKitCV.WebARKitCV(video);
        let overlayCanvas;
        createOverlayCanvas();

        webarkit.setWidth(oWidth)
            .setHeight(oHeight)
            .addTrackable("pinball", "./pinball.jpg")
            .loadTrackables()

        const track = webarkit.build();

        cameraView.initialize(videoSettingData).then(() => {
            console.log(cameraView)
            if (track.isLoaded) {
               let _update = function() {
                    console.log(webarkit)
                    console.log(cameraView.image)
                    webarkit.track(track.trackers, cameraView.image).then((t) => {
                        console.log('tracker: ', t);
                        window.addEventListener("getMatrix", function (e) {
                            console.log('%c infos from getMatrix Event: %o', 'background: orange; color: #000; padding: 2px 4px; border-radius: 3px;', e.detail);
                            drawOverlay(e.detail.finalImage);
                            // If corners are provided, draw them on the overlay and
                            // also call cameraView.drawCorners (internal canvas)
                            try {
                                const corners = e.detail.corners;
                                if (corners && Array.isArray(corners) && corners.length >= 8) {
                                    // draw on overlay so the user sees it
                                    const overlayCtx = overlayCanvas.getContext('2d');
                                    overlayCtx.save();
                                    overlayCtx.strokeStyle = 'lime';
                                    overlayCtx.fillStyle = 'lime';
                                    overlayCtx.lineWidth = 3;
                                    overlayCtx.beginPath();
                                    overlayCtx.moveTo(corners[0], corners[1]);
                                    overlayCtx.lineTo(corners[2], corners[3]);
                                    overlayCtx.lineTo(corners[4], corners[5]);
                                    overlayCtx.lineTo(corners[6], corners[7]);
                                    overlayCtx.closePath();
                                    overlayCtx.stroke();
                                    for (let i = 0; i < 8; i += 2) {
                                        overlayCtx.beginPath();
                                        overlayCtx.arc(corners[i], corners[i+1], 5, 0, Math.PI*2);
                                        overlayCtx.fill();
                                    }
                                    overlayCtx.restore();

                                    // also call cameraView.drawCorners for completeness
                                    if (typeof cameraView.drawCorners === 'function') {
                                        cameraView.drawCorners(corners);
                                    }
                                }
                            } catch (err) {
                                console.warn('Error drawing corners on overlay', err);
                            }
                        })
                        window.addEventListener("lostMarker", function (e) {
                            console.log('infos from lostMarker Event: ', e.detail);
                        })
                    })
                    requestAnimationFrame(_update);
               }
                _update();
            }
        })

        function createOverlayCanvas() {
            overlayCanvas = document.createElement("canvas");
            overlayCanvas.id = "overlay";
            overlayCanvas.width = oWidth;
            overlayCanvas.height = oHeight;
            document.getElementById("app").appendChild(overlayCanvas);
        }
        function drawOverlay(imageData) {
            const overlayCtx = overlayCanvas.getContext("2d");
            overlayCtx.putImageData(imageData, 0, 0);
        }

    </script>

</body>

</html>
